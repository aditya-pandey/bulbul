<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none">
  <!-- Vertical quiet meridian hairline -->
  <line x1="300" y1="110" x2="300" y2="690" stroke="#24201C" stroke-width="0.9" stroke-opacity="0.24"/>
  <!-- Fine orbital arc -->
  <circle cx="300" cy="365" r="168" stroke="#24201C" stroke-width="0.85" stroke-opacity="0.16"/>
  <circle cx="300" cy="365" r="214" stroke="#8C6D46" stroke-width="0.75" stroke-dasharray="2 7" stroke-opacity="0.28"/>

  <!-- Delicate waxing crescent moon -->
  <path d="M324 274 C272 284, 240 335, 250 388 C260 441, 311 474, 364 464 C324 456, 294 420, 294 374 C294 328, 316 292, 324 274 Z" fill="#24201C" fill-opacity="0.86"/>
  <!-- Subtle gold crescent inner gleam -->
  <path d="M321 286 C281 298, 256 340, 264 385 C271 426, 304 455, 344 456" stroke="#B68B4C" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Small full moon phase dot below & above -->
  <circle cx="300" cy="197" r="4.5" fill="#B68B4C" fill-opacity="0.78"/>
  <circle cx="300" cy="533" r="4.5" stroke="#24201C" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="300" cy="612" r="2.2" fill="#24201C" fill-opacity="0.48"/>

  <!-- Minimalist four-point star & pinpoint stars -->
  <path d="M402 246 L405 259 L418 262 L405 265 L402 278 L399 265 L386 262 L399 259 Z" fill="#8C6D46" fill-opacity="0.72"/>
  <circle cx="192" cy="278" r="1.8" fill="#24201C" fill-opacity="0.45"/>
  <circle cx="222" cy="508" r="1.5" fill="#24201C" fill-opacity="0.38"/>
  <circle cx="424" cy="456" r="1.8" fill="#8C6D46" fill-opacity="0.5"/>
  <circle cx="176" cy="402" r="1.3" fill="#24201C" fill-opacity="0.3"/>
  <circle cx="378" cy="186" r="1.4" fill="#24201C" fill-opacity="0.35"/>
</svg>
