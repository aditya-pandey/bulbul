<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none">
  <defs>
    <radialGradient id="mistBotLeft" cx="15%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#87A4A6" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#9BB4B4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9BB4B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistBotRight" cx="88%" cy="82%" r="46%">
      <stop offset="0%" stop-color="#7B989C" stop-opacity="0.54"/>
      <stop offset="55%" stop-color="#9BB4B4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9BB4B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistTopRight" cx="92%" cy="12%" r="38%">
      <stop offset="0%" stop-color="#95AFB0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#95AFB0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmCenter" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#FBF8F1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FBF8F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Atmospheric misty sage-blue watercolour corners framing clean open center -->
  <rect width="600" height="800" fill="url(#warmCenter)"/>
  <circle cx="90" cy="700" r="290" fill="url(#mistBotLeft)"/>
  <circle cx="520" cy="650" r="280" fill="url(#mistBotRight)"/>
  <circle cx="545" cy="95" r="210" fill="url(#mistTopRight)"/>

  <!-- Delicate translucent botanical silhouettes blooming softly at lower edges -->
  <g stroke="#5E7B7E" stroke-linecap="round" stroke-opacity="0.42">
    <path d="M52 790 C62 708, 78 640, 108 576" stroke-width="1.6"/>
    <path d="M84 650 C52 634, 34 612, 26 588" stroke-width="1.2"/>
    <path d="M94 614 C122 598, 144 578, 158 556" stroke-width="1.2"/>
    <path d="M540 792 C522 704, 496 632, 464 566" stroke-width="1.6"/>
    <path d="M506 664 C538 646, 560 622, 574 596" stroke-width="1.2"/>
    <path d="M486 614 C456 600, 434 584, 418 564" stroke-width="1.15"/>
    <!-- Upper-right overhanging quiet branch -->
    <path d="M598 46 C546 72, 502 108, 466 154" stroke-width="1.4"/>
    <path d="M532 86 C526 112, 526 132, 532 148" stroke-width="1.1"/>
  </g>
  <!-- Soft floating pale-gold light motes -->
  <circle cx="486" cy="542" r="2.6" fill="#C48B3B" fill-opacity="0.58"/>
  <circle cx="132" cy="546" r="2.2" fill="#C48B3B" fill-opacity="0.48"/>
  <circle cx="448" cy="182" r="2" fill="#C48B3B" fill-opacity="0.45"/>
