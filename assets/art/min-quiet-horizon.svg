<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none">
  <defs>
    <radialGradient id="dawnOrb" cx="50%" cy="55%" r="52%">
      <stop offset="0%" stop-color="#E7BA78" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#D99B58" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#D99B58" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="600" height="440"/>
    </clipPath>
  </defs>

  <!-- Half-risen warm dawn sun clipped cleanly at horizon -->
  <g clip-path="url(#aboveHorizon)">
    <circle cx="300" cy="442" r="142" fill="url(#dawnOrb)"/>
    <circle cx="300" cy="442" r="92" fill="#DC9E58" fill-opacity="0.36"/>
  </g>

  <!-- Crisp minimalist horizon -->
  <line x1="88" y1="440" x2="512" y2="440" stroke="#241F1B" stroke-width="1.25" stroke-opacity="0.72"/>

  <!-- Whisper-thin sunlit water ripples below horizon -->
  <line x1="212" y1="458" x2="388" y2="458" stroke="#B68044" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.62"/>
  <line x1="234" y1="478" x2="366" y2="478" stroke="#B68044" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.48"/>
  <line x1="254" y1="499" x2="346" y2="499" stroke="#241F1B" stroke-width="1" stroke-linecap="round" stroke-opacity="0.34"/>
  <line x1="270" y1="521" x2="330" y2="521" stroke="#241F1B" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.24"/>
  <line x1="283" y1="544" x2="317" y2="544" stroke="#241F1B" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.16"/>

  <!-- Delicate curved botanical reed rising quietly on the right -->
  <path d="M446 618 C448 532, 434 452, 404 372" stroke="#241F1B" stroke-width="1.25" stroke-linecap="round" stroke-opacity="0.68"/>
  <path d="M428 456 C446 438, 464 426, 480 418" stroke="#241F1B" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M416 408 C400 392, 386 382, 374 378" stroke="#241F1B" stroke-width="0.95" stroke-linecap="round" stroke-opacity="0.48"/>

  <!-- Two tiny birds in open dawn sky -->
  <path d="M214 252 C219 247, 226 247, 230 252 C235 248, 241 248, 244 253 C239 251, 234 251, 230 255 C226 251, 220 250, 214 252 Z" fill="#241F1B" fill-opacity="0.68"/>
  <path d="M266 226 C269 222, 274 222, 277 226 C281 223, 286 223, 288 227 C284 225, 280 225, 277 228 C274 225, 270 225, 266 226 Z" fill="#241F1B" fill-opacity="0.52"/>
</svg>
