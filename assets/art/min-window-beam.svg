  <circle cx="358" cy="412" r="1.6" fill="#B87F32" fill-opacity="0.58"/>
  <circle cx="332" cy="466" r="1.9" fill="#B87F32" fill-opacity="0.5"/>
  <circle cx="394" cy="498" r="1.5" fill="#B87F32" fill-opacity="0.44"/>
  <circle cx="290" cy="392" r="1.4" fill="#231F1B" fill-opacity="0.3"/>
