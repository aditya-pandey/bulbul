<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="beamGrad" x1="250" y1="180" x2="480" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9A75A" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#D9A75A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D9A75A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorGlow" x1="240" y1="590" x2="475" y2="635" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9A75A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#D9A75A" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <!-- Diagonal sunlight shaft -->
  <polygon points="184,195 320,175 510,605 268,625" fill="url(#beamGrad)"/>
  <!-- Minimalist arched window frame -->
  <path d="M184 440 V236 A68 68 0 0 1 320 236 V440 Z" stroke="#231F1B" stroke-width="1.35" stroke-opacity="0.72"/>
  <line x1="252" y1="168" x2="252" y2="440" stroke="#231F1B" stroke-width="0.95" stroke-opacity="0.45"/>
  <line x1="184" y1="305" x2="320" y2="305" stroke="#231F1B" stroke-width="0.95" stroke-opacity="0.45"/>
  <line x1="168" y1="440" x2="336" y2="440" stroke="#231F1B" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.65"/>
  <!-- Soft pool of light on floor -->
  <polygon points="274,606 432,590 486,624 316,642" fill="url(#floorGlow)"/>
  <line x1="120" y1="628" x2="500" y2="628" stroke="#231F1B" stroke-width="0.85" stroke-opacity="0.22"/>
  <!-- Floating sunlit dust motes -->
